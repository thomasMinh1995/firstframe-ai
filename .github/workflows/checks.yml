name: Checks
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHON_DOTENV_DISABLED: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm install --global pnpm@11.13.1
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm build && git diff --check
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PYTHON_DOTENV_DISABLED: '1'
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8034
      TOUR_TEST_URL: http://127.0.0.1:3034
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r ../backend/requirements-dev.txt
      - run: npm ci
      - run: npm install --prefix "$RUNNER_TEMP/browser" --package-lock=false playwright@1.65.1
      - run: '"$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chrome'
      - run: node node_modules/next/dist/bin/next build
      - run: |
          node node_modules/next/dist/bin/next start --port 3034 > "$RUNNER_TEMP/frontend.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3034 > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/frontend.log"
          exit 1
      - run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node tests/saved-library.browser.cjs
      - run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node tests/onboarding-seven-steps.browser.cjs
      - run: |
          python ../backend/tests/ui_workspace_fixture.py > "$RUNNER_TEMP/fixture.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8034/__test/state > /dev/null; then
              python - <<'PYTHON' >> "$GITHUB_ENV"
          import json, os
          from pathlib import Path
          lines = (Path(os.environ['RUNNER_TEMP']) / 'fixture.log').read_text().splitlines()
          print('FIRSTFRAME_QA_DIRECTORY=' + next(json.loads(line)['directory'] for line in lines if line.startswith('{')))
          PYTHON
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/fixture.log"
          exit 1
      - run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node tests/screenplay-context.browser.cjs
